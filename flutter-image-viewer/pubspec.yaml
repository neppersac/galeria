name: flutter_image_viewer
description: A Flutter application to view images from the device in a grid format and full screen.
version: 1.0.0+1
environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^0.8.4+4
  path_provider: ^2.0.11
  photo_view: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/